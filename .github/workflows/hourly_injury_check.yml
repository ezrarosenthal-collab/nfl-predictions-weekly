name: Hourly QB injury check

# Lightweight, runs every hour, checks the NFL's official injury reports
# (via nflverse, the same source used for schedules/play-by-play) for the
# currently-listed starting QB on each team in this week's games. Does NOT
# re-download play-by-play or recompute the model -- see
# scripts/hourly_injury_check.py for why that's intentional.

on:
  schedule:
    - cron: "0 * * * *"   # every hour, on the hour
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  check-injuries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Check QB injury status
        run: python scripts/hourly_injury_check.py --season 2026

      - name: Commit and push if anything changed
        run: |
          git config user.name "nfl-predictions-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "Hourly injury check ($(date -u +%Y-%m-%dT%H:%M))"
          git diff --staged --quiet || git push
