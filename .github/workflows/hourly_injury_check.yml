name: Hourly injury check + grading

# Runs every hour, year-round, and does two things:
# 1. Checks the NFL's official injury reports for each team's currently-
#    listed starting QB (see scripts/hourly_injury_check.py).
# 2. Grades any newly-completed games against real final scores.
#
# Grading used to run ONLY on six specific times tied to the normal game
# schedule (see grade_predictions.yml) -- but that missed a real game
# (DEN @ KC) that didn't fall cleanly into one of those windows. Rather
# than guess at more special-case times, grading now also runs here,
# every single hour, so ANY completed game gets picked up within an hour
# of finishing, regardless of when it was actually played. The six-time
# workflow still exists too (an early check right after the normal
# windows doesn't hurt), but this hourly run is what actually guarantees
# nothing gets missed.

on:
  schedule:
    - cron: "0 * * * *"   # every hour, on the hour
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  check-injuries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Check QB injury status
        run: python scripts/hourly_injury_check.py --season 2026

      - name: Grade any newly-completed games
        run: python scripts/grade_predictions.py --season 2026

      - name: Re-render site with updated track record
        run: |
          WEEK=$(python -c "import sys; sys.path.insert(0,'.'); from app.schedule import current_week; print(current_week(2026))")
          python scripts/render_html.py --season 2026 --week $WEEK

      - name: Commit and push if anything changed
        run: |
          git config user.name "nfl-predictions-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "Nothing changed, nothing to push."
          else
            git commit -m "Hourly injury check + grading ($(date -u +%Y-%m-%dT%H:%M))"
            git fetch origin main
            git rebase origin/main -X ours || git rebase --abort
            git push
          fi
