function fairOdds(mlHome,mlAway){
  if(mlHome==null||mlAway==null) return {home:null,away:null};
  const ih = mlHome<0 ? -mlHome/(-mlHome+100) : 100/(mlHome+100);
  const ia = mlAway>0 ? 100/(mlAway+100) : -mlAway/(-mlAway+100);
  const s = ih+ia;
  return {home:(ih/s)*100, away:(ia/s)*100};
}
function renderCard(g, i) {
  const homeWp = g.home_win_prob, awayWp = g.away_win_prob;
  const market = fairOdds(g.market.moneyline_home, g.market.moneyline_away);
  const confBars = g.bet ? [1,2,3,4,5].map(n=>`<div class="conf-bar${n<=g.bet.confidence?' filled':''}"></div>`).join('') : '';
  const featRows = (g.feature_breakdown||[]).map(f=>{
    const leftPct = f.weighted_diff>=0 ? 50 : Math.max(0,50+f.weighted_diff*10);
    const widthPct = Math.min(Math.abs(f.weighted_diff)*10,50);
    const color = f.favors==='home' ? g.home_color : g.away_color;
    const favTeam = f.favors==='home' ? g.home_team : g.away_team;
    return `<div class="feat-row"><span class="feat-name">${esc(f.label)}</span>
      <div class="feat-bar-track"><div class="feat-bar-fill" style="left:${leftPct}%;width:${widthPct}%;background:${color}"></div><div class="feat-bar-mid"></div></div>
      <span class="feat-favors" style="color:${color}">${favTeam}</span></div>`;
  }).join('');
  const rawNote = (g.raw_model_home_wp!==homeWp) ?
    `<div class="raw-model-note">Raw stat model (before context adjustment): ${g.home_team} ${g.raw_model_home_wp.toFixed(0)}% / ${g.away_team} ${g.raw_model_away_wp.toFixed(0)}%.</div>` : '';
  const contextHtml = g.context ? `<div class="callout-card"><strong>Context:</strong> ${esc(g.context)}</div>` : '';
  const qbWatchHtml = g.qb_watch ? `<div class="qb-watch-card"><strong>🤖 Auto-detected:</strong> ${esc(g.qb_watch)}</div>` : '';
  const betHtml = g.bet ? `<div class="bet-card">
      <div class="bet-header"><span class="bet-verdict">${esc(g.bet.pick)}</span><div class="conf-meter">${confBars}</div></div>
      <div class="bet-line-row"><span class="bet-line-label">Market:</span><span class="bet-line-val">spread ${g.market.spread_line ?? '—'} · ML ${g.market.moneyline_home??'—'}/${g.market.moneyline_away??'—'} · O/U ${g.market.total_line??'—'}${market.home?` · fair-odds ${g.home_team} ${market.home.toFixed(0)}% / ${g.away_team} ${market.away.toFixed(0)}%`:''}</span></div>
      <p class="bet-reasoning">${esc(g.bet.note)}</p></div>` : '';

  return `<div class="game-card">
    <button class="card-header" onclick="toggleCard(${i})">
      <div class="teams-row">
        <span class="team-tag" style="color:${g.away_color}">${g.away_team}</span>
        <span class="vs-text">@</span>
        <span class="team-tag" style="color:${g.home_color}">${g.home_team}</span>
        <span class="time-text">${esc(g.time_et||'')} · ${esc(g.location||'')}</span>
      </div>
      <div class="header-right">
        <span class="header-pct">${awayWp.toFixed(0)}%-${homeWp.toFixed(0)}%</span>
        <span class="chevron" id="chev-${i}">⌄</span>
      </div>
    </button>
    <div class="card-body" id="body-${i}">
      <div class="prediction-card">
        <div class="prediction-label">Model Prediction</div>
        <div class="prob-row">
          <div class="team-prob-block"><span class="team-abbr" style="color:${g.away_color}">${g.away_team}</span><span class="team-pct">${awayWp.toFixed(0)}%</span></div>
          <div class="prob-bar-wrap"><div class="prob-bar">
            <div class="prob-bar-fill" style="width:${awayWp}%;background:${g.away_color}"></div>
            <div class="prob-bar-fill" style="width:${homeWp}%;background:${g.home_color}"></div>
          </div></div>
          <div class="team-prob-block" style="align-items:flex-end"><span class="team-abbr" style="color:${g.home_color}">${g.home_team}</span><span class="team-pct">${homeWp.toFixed(0)}%</span></div>
        </div>
        <div class="score-row">Model score: <strong style="color:${g.away_color}">${g.away_team} ${g.away_score_est.toFixed(1)}</strong> — <strong style="color:${g.home_color}">${g.home_team} ${g.home_score_est.toFixed(1)}</strong><span class="score-hint"> · total ${(g.away_score_est+g.home_score_est).toFixed(1)}</span></div>
        ${rawNote}
      </div>
      ${betHtml}
      ${qbWatchHtml}
      ${contextHtml}
      <div class="sub-panel"><div class="sub-panel-title">Feature Breakdown</div>${featRows}</div>
    </div>
  </div>`;
}
function toggleCard(i){
  const b=document.getElementById(`body-${i}`), c=document.getElementById(`chev-${i}`);
  const open = b.classList.contains('open');
  b.classList.toggle('open', !open); c.classList.toggle('open', !open);
}
document.getElementById('app').innerHTML = DATA.games.map((g,i)=>renderCard(g,i)).join('');
</script>
</body>
