<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}" />
<meta name="robots" content="index, follow" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --bg:#12161B; --bg-alt:#0D1013; --card:#171C22; --card-alt:#14181D;
    --border:#262B32; --border-alt:#21262D;
    --text:#E8E6E1; --text-dim:#8B929B; --text-dimmer:#6E747C; --text-faint:#565C64;
    --gold:#D4A039; --blue:#5B8FD9;
    --bet-bg:#1F1A14; --bet-border:#4A3A20; --bet-text:#F2C572; --bet-body:#C7B999;
    --callout-bg:#20221A; --callout-border:#3D3722; --callout-text:#C7BE9C;
    --auto-bg:#122018; --auto-border:#254a34; --auto-text:#7fd9a8;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#F4F1EA; --bg-alt:#EDE9DF; --card:#FFFFFF; --card-alt:#FAF8F3;
      --border:#E1DCCF; --border-alt:#E9E4D8;
      --text:#1E1C17; --text-dim:#5A5648; --text-dimmer:#7A7566; --text-faint:#9B9585;
      --gold:#B07E1E; --blue:#3E6BB0;
      --bet-bg:#FBF3E3; --bet-border:#E4CB98; --bet-text:#8A5E12; --bet-body:#6B5230;
      --callout-bg:#F1EBD9; --callout-border:#D8CBA0; --callout-text:#6B5F3E;
      --auto-bg:#E9F5EE; --auto-border:#B9DCC7; --auto-text:#2C6E48;
    }
  }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; }
  .header { border-bottom:1px solid var(--border); background:var(--bg-alt); }
  .header-inner { max-width:760px; margin:0 auto; padding:20px; }
  .brand { display:flex; align-items:center; gap:14px; font-family:'Archivo Narrow',sans-serif; font-weight:700; font-size:34px; letter-spacing:.3px; }
  .brand-mark { flex-shrink:0; filter:drop-shadow(0 0 10px color-mix(in srgb, var(--gold) 55%, transparent)); }
  .brand-text { background:linear-gradient(90deg, var(--text) 0%, var(--gold) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tag { margin-top:8px; font-size:12.5px; color:var(--text-dim); line-height:1.5; }
  .updated-badge { display:inline-block; margin-top:10px; padding:4px 10px; border-radius:20px; background:var(--auto-bg); border:1px solid var(--auto-border); color:var(--auto-text); font-size:11px; font-weight:600; }
  main { max-width:760px; margin:0 auto; padding:20px; }
  @media (min-width: 820px) {
    main { max-width:1180px; }
    #app { display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start; }
    #app .game-card { margin-bottom:0; }
  }
  .day-section { margin-bottom:20px; }
  .day-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--text-dimmer); margin-bottom:8px; padding-left:2px; }
  .game-card { background:var(--card); border:1px solid var(--border); border-radius:16px; margin-bottom:10px; overflow:hidden; }
  .game-card-trigger { all:unset; box-sizing:border-box; display:block; width:100%; cursor:pointer; }
  .game-card-trigger:hover .sb-row { filter:brightness(1.03); }
  .sb-topbar { padding:10px 20px; font-size:12px; color:var(--text-dimmer); background:var(--card-alt); display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .props-trigger { all:unset; cursor:pointer; font-size:11px; font-weight:700; color:var(--gold); padding:4px 10px; border:1px solid var(--gold); border-radius:20px; flex-shrink:0; }
  .props-team-col { flex:1; }
  .props-team-header { font-size:12.5px; font-weight:700; margin-bottom:8px; }
  .props-player-row { padding:8px 0; border-top:1px solid var(--border); }
  .props-player-row:first-child { border-top:none; }
  .props-player-name { font-size:12.5px; font-weight:600; }
  .props-player-slot { font-size:10px; color:var(--text-dimmer); text-transform:uppercase; letter-spacing:.4px; }
  .props-player-line { font-size:11.5px; color:var(--text-dim); margin-top:2px; }
  .redzone-pick { display:flex; justify-content:space-between; padding:8px 12px; background:var(--card-alt); border-radius:8px; margin-bottom:6px; font-size:12px; }
  .sb-row { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; }
  .sb-team-abbr { font-family:'Archivo Narrow',sans-serif; font-weight:700; font-size:26px; line-height:1; }
  .sb-team-name { font-size:12.5px; color:var(--text-dimmer); margin-top:3px; }
  .sb-team-pct { font-family:'Archivo Narrow',sans-serif; font-weight:700; font-size:32px; }
  .sb-team-pct.dim { color:var(--text-dimmer); }
  .sb-footer { display:flex; justify-content:space-between; align-items:center; padding:12px 20px; border-top:1px solid var(--border); font-size:12.5px; color:var(--text-dim); }
  .sb-chevron { font-size:16px; color:var(--text-dimmer); transition:transform .15s; }
  .sb-chevron.open { transform:rotate(180deg); }
  .teams-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .team-tag { font-family:'Archivo Narrow',sans-serif; font-weight:700; font-size:15px; }
  .vs-text { color:var(--text-dimmer); font-size:12px; }
  .time-text { color:var(--text-dimmer); font-size:11px; margin-left:6px; }
  .header-right { display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .header-pct { font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; }
  .chevron { color:var(--text-dimmer); transition:transform .15s; display:inline-block; }
  .chevron.open { transform:rotate(180deg); }
  .card-body { border-top:1px solid var(--border); padding:16px; display:none; }
  .card-body.open { display:block; }
  .prediction-card { background:linear-gradient(180deg, color-mix(in srgb, var(--card) 85%, white 6%), var(--card)); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:10px; }
  .prediction-label { font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--gold); font-weight:700; margin-bottom:12px; }
  .prob-row { display:flex; align-items:center; gap:14px; }
  .team-prob-block { display:flex; flex-direction:column; min-width:56px; }
  .team-abbr { font-family:'Archivo Narrow',sans-serif; font-weight:700; font-size:14px; }
  .team-pct { font-family:'Archivo Narrow',sans-serif; font-weight:700; font-size:30px; line-height:1.05; }
  .prob-bar-wrap { flex:1; }
  .prob-bar { display:flex; height:10px; border-radius:5px; overflow:hidden; background:var(--border); }
  .prob-bar-fill { height:100%; }
  .score-row { margin-top:14px; padding-top:12px; border-top:1px solid var(--border); font-size:13px; color:var(--text-dim); }
  .score-hint { color:var(--text-dimmer); }
  .raw-model-note { margin-top:8px; font-size:11px; color:var(--text-dimmer); line-height:1.5; }
  .bet-card { background:var(--bet-bg); border:1px solid var(--bet-border); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  .bet-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; flex-wrap:wrap; }
  .bet-verdict { font-family:'Archivo Narrow',sans-serif; font-weight:700; font-size:13.5px; color:var(--bet-text); }
  .conf-meter { display:flex; gap:4px; }
  .conf-bar { width:14px; height:6px; border-radius:3px; background:color-mix(in srgb, var(--border) 80%, black 10%); }
  .conf-bar.filled { background:var(--gold); }
  .bet-line-row { font-size:11.5px; margin-bottom:8px; }
  .bet-line-label { color:color-mix(in srgb, var(--bet-text) 60%, var(--text-dimmer) 40%); margin-right:6px; }
  .bet-line-val { color:var(--bet-body); font-weight:600; }
  .bet-reasoning { font-size:12px; line-height:1.55; color:var(--bet-body); margin:0; }
  .callout-card { background:var(--callout-bg); border:1px solid var(--callout-border); border-radius:10px; padding:12px 14px; font-size:12px; line-height:1.6; color:var(--callout-text); margin-bottom:10px; }
  .injury-alert-card { background:#2A1518; border:1px solid #5C2A2E; border-radius:10px; padding:12px 14px; font-size:12px; line-height:1.6; color:#F0A8AE; margin-bottom:10px; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) .injury-alert-card { background:#FBEAEA; border-color:#E8B8BC; color:#8A2E36; }
  }
  .record-ticker { width:100%; box-sizing:border-box; display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 16px; margin-top:14px; cursor:pointer; font-family:inherit; color:inherit; text-align:left; }
  .record-ticker-left { display:flex; align-items:center; gap:10px; }
  .record-ticker-title { font-size:13.5px; font-weight:700; }
  .record-ticker-sub { font-size:11.5px; color:var(--text-dim); margin-top:1px; }
  .record-ticker-chevron { color:var(--text-dimmer); font-size:16px; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.55); display:none; align-items:flex-start; justify-content:center; z-index:1000; overflow-y:auto; padding:24px 12px; }
  .modal-overlay.open { display:flex; }
  .modal-card { background:var(--bg); border-radius:14px; max-width:520px; width:100%; padding:20px; margin-top:10px; }
  .modal-header { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .modal-back { cursor:pointer; background:none; border:none; color:var(--text); font-size:18px; padding:4px; }
  .modal-title { font-size:16px; font-weight:700; }
  .record-hero { background:var(--card); border-radius:12px; padding:18px; text-align:center; margin-bottom:18px; }
  .record-hero-num { font-family:'Archivo Narrow',sans-serif; font-size:32px; font-weight:700; }
  .record-hero-sub { font-size:12.5px; color:var(--text-dim); margin-top:4px; }
  .modal-section-title { font-size:13px; font-weight:700; margin-bottom:8px; }
  .modal-section-note { font-size:11.5px; color:var(--text-dimmer); margin-bottom:8px; line-height:1.5; }
  .modal-list { background:var(--card); border-radius:12px; overflow:hidden; margin-bottom:20px; }
  .modal-list-row { display:flex; justify-content:space-between; padding:10px 16px; font-size:13px; border-top:1px solid var(--border); }
  .modal-list-row:first-child { border-top:none; }
  .modal-list-row.top3 { font-weight:700; }
  .qb-watch-card { background:var(--auto-bg); border:1px solid var(--auto-border); border-radius:10px; padding:12px 14px; font-size:12px; line-height:1.6; color:var(--auto-text); margin-bottom:10px; }
  .sub-panel { background:var(--card-alt); border:1px solid var(--border-alt); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .sub-panel-title { font-size:12.5px; font-weight:600; margin-bottom:10px; }
  .feat-row { display:flex; align-items:center; gap:10px; padding:5px 0; }
  .feat-name { font-size:11px; opacity:.85; width:150px; flex-shrink:0; }
  .feat-bar-track { position:relative; flex:1; height:7px; background:var(--border); border-radius:4px; }
  .feat-bar-mid { position:absolute; left:50%; top:-3px; bottom:-3px; width:1px; background:var(--text-faint); }
  .feat-bar-fill { position:absolute; top:0; bottom:0; border-radius:4px; }
  .feat-favors { font-size:10.5px; font-weight:700; width:34px; text-align:right; }
  .snap-header-row { display:grid; grid-template-columns:1fr 2fr 1fr; padding:6px 0; border-bottom:1px solid var(--border); margin-bottom:2px; }
  .snap-team-header { font-size:11px; font-weight:700; font-family:'Archivo Narrow',sans-serif; }
  .snap-stat-header { font-size:10px; color:var(--text-dimmer); text-align:center; text-transform:uppercase; }
  .snap-row { display:grid; grid-template-columns:1fr 2fr 1fr; padding:5px 0; font-size:11.5px; border-bottom:1px solid var(--border-alt); }
  .snap-val { font-variant-numeric:tabular-nums; }
  .snap-label { color:var(--text-dim); text-align:center; font-size:10.5px; }
  .qb-row { display:flex; gap:12px; }
  .qb-block { flex:1; }
  .qb-name { font-size:12.5px; font-weight:700; display:block; }
  .qb-rate { font-size:11px; color:var(--text-dim); }
  .qb-note { font-size:11px; color:var(--text-dim); line-height:1.5; margin-top:4px; }
  footer { text-align:center; font-size:11px; color:var(--text-faint); padding:20px 20px 30px; line-height:1.6; max-width:760px; margin:0 auto; }
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div class="brand">
      <svg class="brand-mark" width="46" height="46" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
        <circle cx="30" cy="30" r="28" fill="var(--bg-alt)" stroke="var(--gold)" stroke-width="1.5"/>
        <path d="M30,9 C43,9 50,20 50,30 C50,40 43,51 30,51 C17,51 10,40 10,30 C10,20 17,9 30,9 Z" fill="none" stroke="var(--text)" stroke-width="2"/>
        <line x1="30" y1="21" x2="30" y2="39" stroke="var(--text)" stroke-width="2"/>
        <line x1="26" y1="24" x2="34" y2="24" stroke="var(--text)" stroke-width="1.5"/>
        <line x1="26" y1="28.5" x2="34" y2="28.5" stroke="var(--text)" stroke-width="1.5"/>
        <line x1="26" y1="33" x2="34" y2="33" stroke="var(--text)" stroke-width="1.5"/>
        <line x1="26" y1="37" x2="34" y2="37" stroke="var(--text)" stroke-width="1.5"/>
        <polyline points="12,42 21,30 27,35 47,13" fill="none" stroke="var(--gold)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M40,13 L47,13 L47,20" fill="none" stroke="var(--gold)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-text">NFL Predictions</span>
    </div>
    <div class="tag">{{SUBTITLE}}</div>
    <div class="updated-badge">🔄 Auto-updated {{GENERATED_AT}}</div>
    <button class="record-ticker" id="record-ticker" onclick="openRecordModal()" style="display:none">
      <div class="record-ticker-left">
        <div>
          <div class="record-ticker-title" id="record-ticker-title">Season record: —</div>
          <div class="record-ticker-sub" id="record-ticker-sub">Tap for the full breakdown</div>
        </div>
      </div>
      <span class="record-ticker-chevron">›</span>
    </button>
  </div>
</div>
<div class="modal-overlay" id="record-modal" onclick="if(event.target===this) closeRecordModal()">
  <div class="modal-card">
    <div class="modal-header">
      <button class="modal-back" onclick="closeRecordModal()">←</button>
      <div class="modal-title">Track record</div>
    </div>
    <div id="record-modal-body"></div>
  </div>
</div>
<div class="modal-overlay" id="player-modal" onclick="if(event.target===this) closePlayerProps()">
  <div class="modal-card">
    <div class="modal-header">
      <button class="modal-back" onclick="closePlayerProps()">←</button>
      <div class="modal-title" id="player-modal-title">Key Players</div>
    </div>
    <div id="player-modal-body"></div>
  </div>
</div>
<main id="app"></main>
<footer>{{FOOTER}}</footer>
<script>
const DATA = {{GAMES_JSON}};
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
function fairOdds(mlHome,mlAway){
  if(mlHome==null||mlAway==null) return {home:null,away:null};
  const ih = mlHome<0 ? -mlHome/(-mlHome+100) : 100/(mlHome+100);
  const ia = mlAway>0 ? 100/(mlAway+100) : -mlAway/(-mlAway+100);
  const s = ih+ia;
  return {home:(ih/s)*100, away:(ia/s)*100};
}
function renderCard(g, i) {
  const homeWp = g.home_win_prob, awayWp = g.away_win_prob;
  const market = fairOdds(g.market.moneyline_home, g.market.moneyline_away);
  const confBars = g.bet ? [1,2,3,4,5].map(n=>`<div class="conf-bar${n<=g.bet.confidence?' filled':''}"></div>`).join('') : '';
  const featRows = (g.feature_breakdown||[]).map(f=>{
    const leftPct = f.weighted_diff>=0 ? 50 : Math.max(0,50+f.weighted_diff*10);
    const widthPct = Math.min(Math.abs(f.weighted_diff)*10,50);
    const color = f.favors==='home' ? g.home_color : g.away_color;
    const favTeam = f.favors==='home' ? g.home_team : g.away_team;
    return `<div class="feat-row"><span class="feat-name">${esc(f.label)}</span>
      <div class="feat-bar-track"><div class="feat-bar-fill" style="left:${leftPct}%;width:${widthPct}%;background:${color}"></div><div class="feat-bar-mid"></div></div>
      <span class="feat-favors" style="color:${color}">${favTeam}</span></div>`;
  }).join('');
  const rawNote = (g.raw_model_home_wp!==homeWp) ?
    `<div class="raw-model-note">Raw stat model (before context adjustment): ${g.home_team} ${g.raw_model_home_wp.toFixed(0)}% / ${g.away_team} ${g.raw_model_away_wp.toFixed(0)}%.</div>` : '';
  const contextHtml = g.context ? `<div class="callout-card"><strong>Context:</strong> ${esc(g.context)}</div>` : '';
  const qbWatchHtml = g.qb_watch ? `<div class="qb-watch-card"><strong>🤖 Auto-detected:</strong> ${esc(g.qb_watch)}</div>` : '';
  const injuryAlerts = [g.away_qb_injury_alert && `${g.away_team}: ${g.away_qb_injury_alert}`, g.home_qb_injury_alert && `${g.home_team}: ${g.home_qb_injury_alert}`].filter(Boolean);
  const injuryAlertHtml = injuryAlerts.length ? `<div class="injury-alert-card"><strong>🚨 QB injury alert:</strong> ${injuryAlerts.map(esc).join(' · ')}</div>` : '';

  // Full team injury report -- every position, not just QB
  const awayTeamInj = g.away_team_injuries || [];
  const homeTeamInj = g.home_team_injuries || [];
  let fullInjuryHtml = '';
  if (awayTeamInj.length || homeTeamInj.length) {
    const listItems = (team, list) => list.map(a => `<li>${esc(a)}</li>`).join('');
    fullInjuryHtml = `<div class="sub-panel"><div class="sub-panel-title">Injury Report (all positions, checked hourly)</div>
      <div class="qb-row">
        <div class="qb-block"><span class="qb-name" style="color:${g.away_color}">${g.away_team}</span>${awayTeamInj.length ? `<ul style="margin:6px 0 0;padding-left:16px;font-size:11px;color:var(--text-dim)">${listItems(g.away_team,awayTeamInj)}</ul>` : `<p class="qb-note">Nothing flagged</p>`}</div>
        <div class="qb-block"><span class="qb-name" style="color:${g.home_color}">${g.home_team}</span>${homeTeamInj.length ? `<ul style="margin:6px 0 0;padding-left:16px;font-size:11px;color:var(--text-dim)">${listItems(g.home_team,homeTeamInj)}</ul>` : `<p class="qb-note">Nothing flagged</p>`}</div>
      </div></div>`;
  }
  const betHtml = g.bet ? `<div class="bet-card">
      <div class="bet-header"><span class="bet-verdict">${esc(g.bet.pick)}</span><div class="conf-meter">${confBars}</div></div>
      <div class="bet-line-row"><span class="bet-line-label">Market:</span><span class="bet-line-val">spread ${g.market.spread_line ?? '—'} · ML ${g.market.moneyline_home??'—'}/${g.market.moneyline_away??'—'} · O/U ${g.market.total_line??'—'}${market.home?` · fair-odds ${g.home_team} ${market.home.toFixed(0)}% / ${g.away_team} ${market.away.toFixed(0)}%`:''}</span></div>
      <p class="bet-reasoning">${esc(g.bet.note)}</p></div>` : '';

  // Season stats snapshot -- shown for every game, not just researched ones
  let snapshotHtml = '';
  if (g.home_stats && g.away_stats) {
    const hs = g.home_stats, as_ = g.away_stats;
    const rows = [
      ["Points / Game", as_.ppg, hs.ppg, true],
      ["Points Allowed / Game", as_.papg, hs.papg, false],
      ["Offensive EPA / Play", as_.off_epa_per_play, hs.off_epa_per_play, true],
      ["Defensive EPA / Play Allowed", as_.def_epa_per_play, hs.def_epa_per_play, false],
      ["EPA Margin", as_.epa_margin, hs.epa_margin, true],
      ["Turnover Margin", as_.turnover_margin, hs.turnover_margin, true],
      ["Explosive Play Rate (Off)", as_.off_explosive_rate*100, hs.off_explosive_rate*100, true],
      ["Explosive Plays Allowed (Def)", as_.def_explosive_rate*100, hs.def_explosive_rate*100, false],
      ["Third Down Conversion %", as_.third_down_pct*100, hs.third_down_pct*100, true],
      ["Red Zone TD Rate", as_.redzone_td_rate*100, hs.redzone_td_rate*100, true],
      ["Completion % Over Expected", as_.cpoe, hs.cpoe, true],
      ["Sack Rate Allowed", as_.sack_rate_allowed*100, hs.sack_rate_allowed*100, false],
      ["INT Rate", as_.int_rate*100, hs.int_rate*100, false],
    ];
    const rowsHtml = rows.map(([label, av, hv, higherBetter]) => {
      const awayWins = higherBetter ? av > hv : av < hv;
      const fmt = (n) => Math.abs(n) < 1 ? n.toFixed(3) : n.toFixed(1);
      return `<div class="snap-row">
        <span class="snap-val" style="font-weight:${awayWins?700:400};color:${awayWins?g.away_color:'var(--text-dim)'}">${awayWins?'● ':''}${fmt(av)}</span>
        <span class="snap-label">${esc(label)}</span>
        <span class="snap-val" style="text-align:right;font-weight:${!awayWins?700:400};color:${!awayWins?g.home_color:'var(--text-dim)'}">${fmt(hv)}${!awayWins?' ●':''}</span>
      </div>`;
    }).join('');
    snapshotHtml = `<div class="sub-panel"><div class="sub-panel-title">Season Stats Snapshot — Who Wins Each Category</div>
      <div class="snap-header-row"><span class="snap-team-header" style="color:${g.away_color}">${g.away_team}</span><span class="snap-stat-header">Stat</span><span class="snap-team-header" style="color:${g.home_color};text-align:right">${g.home_team}</span></div>
      ${rowsHtml}</div>`;
  }

  // QB comparison -- shown for every game
  let qbHtml = '';
  if (g.home_qb || g.away_qb) {
    const qbBlock = (qb, color) => qb ? `<div class="qb-block">
        <span class="qb-name" style="color:${color}">${esc(qb.name)}</span>
        <span class="qb-rate">${qb.rate.toFixed(1)} rating</span>
        ${qb.note ? `<p class="qb-note">${esc(qb.note)}</p>` : ''}
      </div>` : '<div class="qb-block"></div>';
    qbHtml = `<div class="sub-panel"><div class="sub-panel-title">Quarterbacks</div>
      <div class="qb-row">${qbBlock(g.away_qb, g.away_color)}${qbBlock(g.home_qb, g.home_color)}</div></div>`;
  }


  const favored = homeWp >= awayWp ? 'home' : 'away';
  const rowTint = (color, isFavored) => `color-mix(in srgb, ${color} ${isFavored?18:7}%, var(--card) ${isFavored?82:93}%)`;

  return `<div class="game-card">
    <div class="sb-topbar">
      <span>${esc(g.time_et||'')} · ${g.location==='Neutral' ? 'Neutral site' : `${esc(g.home_name||g.home_team)} home`}</span>
      ${g.player_props ? `<button class="props-trigger" onclick="openPlayerProps(${i})">Players</button>` : ''}
    </div>
    <button class="game-card-trigger" onclick="toggleCard(${i})">
      <div class="sb-row" style="background:${rowTint(g.away_color, favored==='away')}">
        <div><div class="sb-team-abbr" style="color:${g.away_color}">${g.away_team}</div><div class="sb-team-name">${esc(g.away_name||'')}</div></div>
        <div class="sb-team-pct" style="color:${g.away_color}">${awayWp.toFixed(0)}%</div>
      </div>
      <div class="sb-row" style="background:${rowTint(g.home_color, favored==='home')}">
        <div><div class="sb-team-abbr" style="color:${g.home_color}">${g.home_team}</div><div class="sb-team-name">${esc(g.home_name||'')}</div></div>
        <div class="sb-team-pct" style="color:${g.home_color}">${homeWp.toFixed(0)}%</div>
      </div>
      <div class="sb-footer">
        <span>Projected ${g.away_score_est.toFixed(1)} – ${g.home_score_est.toFixed(1)} · O/U ${(g.away_score_est+g.home_score_est).toFixed(1)}</span>
        <i class="sb-chevron" id="chev-${i}">⌄</i>
      </div>
    </button>
    <div class="card-body" id="body-${i}">
      ${rawNote ? `<div class="sub-panel">${rawNote}</div>` : ''}
      ${betHtml}
      ${injuryAlertHtml}
      ${qbWatchHtml}
      ${contextHtml}
      <div class="sub-panel"><div class="sub-panel-title">Feature Breakdown</div>${featRows}</div>
      ${qbHtml}
      ${fullInjuryHtml}
      ${snapshotHtml}
    </div>
  </div>`;
}
function toggleCard(i){
  const b=document.getElementById(`body-${i}`), c=document.getElementById(`chev-${i}`);
  const open = b.classList.contains('open');
  b.classList.toggle('open', !open); c.classList.toggle('open', !open);
}
document.getElementById('app').innerHTML = DATA.games.map((g,i)=>renderCard(g,i)).join('');

function initRecordTicker(){
  const rec = DATA.track_record;
  const el = document.getElementById('record-ticker');
  el.style.display = 'flex';
  if(!rec || rec.overall.total===0){
    document.getElementById('record-ticker-title').textContent = 'Season record: not started yet';
    document.getElementById('record-ticker-sub').textContent = 'Tap to see how this will look once games are graded';
    return;
  }
  const pct = Math.round((rec.overall.correct/rec.overall.total)*100);
  document.getElementById('record-ticker-title').textContent = `Season record: ${rec.overall.correct}-${rec.overall.total-rec.overall.correct}`;
  document.getElementById('record-ticker-sub').textContent = `${pct}% correct · tap for the full breakdown`;
}
function teamName(abbr){ return (DATA.team_names && DATA.team_names[abbr] && DATA.team_names[abbr].name) || abbr; }
function openRecordModal(){
  const rec = DATA.track_record;
  if(!rec || rec.overall.total===0){
    document.getElementById('record-modal-body').innerHTML =
      `<div class="record-hero"><div class="record-hero-num">—</div><div class="record-hero-sub">No games graded yet — check back after Week 1 kicks off</div></div>`;
    document.getElementById('record-modal').classList.add('open');
    return;
  }
  const pct = rec.overall.total ? Math.round((rec.overall.correct/rec.overall.total)*100) : 0;
  let html = `<div class="record-hero">
    <div class="record-hero-num">${rec.overall.correct}-${rec.overall.total-rec.overall.correct}</div>
    <div class="record-hero-sub">${pct}% correct · ${rec.overall.total} games graded</div>
  </div>`;

  html += `<div class="modal-section-title">By week</div><div class="modal-list">`;
  const weekNums = Object.keys(rec.weeks).map(Number).sort((a,b)=>a-b);
  html += weekNums.map(w => {
    const wr = rec.weeks[w];
    return `<div class="modal-list-row"><span>Week ${w}</span><span>${wr.correct}-${wr.total-wr.correct}</span></div>`;
  }).join('');
  html += `</div>`;

  html += `<div class="modal-section-title">Team accuracy rankings</div>
    <div class="modal-section-note">Every team involved in a correctly-predicted game gets credit — this ranks how reliable the model has been for each team, not their real win-loss record.</div>
    <div class="modal-list">`;
  const teamEntries = Object.entries(rec.teams)
    .map(([abbr, t]) => ({abbr, ...t, pct: t.total ? t.correct/t.total : 0}))
    .sort((a,b) => b.pct - a.pct || b.total - a.total);
  html += teamEntries.map((t, i) => {
    return `<div class="modal-list-row${i<3?' top3':''}"><span>${i+1}. ${teamName(t.abbr)}</span><span>${t.correct}-${t.total-t.correct}</span></div>`;
  }).join('');
  html += `</div>`;

  document.getElementById('record-modal-body').innerHTML = html;
  document.getElementById('record-modal').classList.add('open');
}
function closeRecordModal(){
  document.getElementById('record-modal').classList.remove('open');
}
initRecordTicker();

function slotLabel(slot){ return {rb1:'RB1', wr1:'WR1', wr2:'WR2', te1:'TE1'}[slot] || slot; }

function playerRow(slot, p, color){
  if(!p) return `<div class="props-player-row"><span class="props-player-slot">${slotLabel(slot)}</span><div class="props-player-line">No qualifying player found</div></div>`;
  const stat = p.position === 'RB'
    ? `${p.carries_per_g} carries/g · ${p.rush_yds_per_g} yds/g (season avg)`
    : `${p.targets_per_g} targets/g · ${p.rec_yds_per_g} yds/g (season avg)`;
  return `<div class="props-player-row">
    <span class="props-player-slot">${slotLabel(slot)}</span>
    <div class="props-player-name" style="color:${color}">${esc(p.player_display_name)}</div>
    <div class="props-player-line">${stat}</div>
    <div class="props-player-line">Projected this matchup: <strong>${p.projected_yards} yds</strong> (opponent allows ${p.opponent_allows_per_g}/g vs league avg ${p.league_avg_allowed_per_g}/g)</div>
  </div>`;
}

function openPlayerProps(i){
  const g = DATA.games[i];
  const props = g.player_props;
  if(!props) return;
  document.getElementById('player-modal-title').textContent = `${g.away_team} @ ${g.home_team} — Key Players`;

  let html = `<div class="modal-section-note">RB1/WR1/WR2/TE1 are each team's most-used player at that position last season — a real, data-driven starting point, not a live depth-chart check. A trade, injury, or new starter can make this out of date the same way it can for a team's quarterback (see the note on the game card if that's happened). Yardage projections adjust each player's season average for this specific opponent's real defense-vs-position numbers.</div>`;

  html += `<div style="display:flex;gap:16px;margin-bottom:20px">
    <div class="props-team-col"><div class="props-team-header" style="color:${g.away_color}">${g.away_team}</div>
      ${['rb1','wr1','wr2','te1'].map(slot => playerRow(slot, props.away[slot], g.away_color)).join('')}
    </div>
    <div class="props-team-col"><div class="props-team-header" style="color:${g.home_color}">${g.home_team}</div>
      ${['rb1','wr1','wr2','te1'].map(slot => playerRow(slot, props.home[slot], g.home_color)).join('')}
    </div>
  </div>`;

  // Favorable red zone section: a qualitative signal, not a TD probability.
  const allPlayers = [];
  for(const side of ['home','away']){
    const color = side==='home' ? g.home_color : g.away_color;
    const team = side==='home' ? g.home_team : g.away_team;
    for(const slot of ['rb1','wr1','wr2','te1']){
      const p = props[side][slot];
      if(p) allPlayers.push({...p, team, color, slot});
    }
  }
  allPlayers.sort((a,b) => b.redzone_favorability - a.redzone_favorability);
  const top = allPlayers.slice(0, 4);

  html += `<div class="modal-section-title">Favorable Red Zone Matchups</div>
    <div class="modal-section-note">Not a touchdown probability — touchdowns are too random game-to-game for that to be honest. This ranks players by their own scoring role combined with how many touchdowns their opponent allows at that position, as a "worth watching" signal.</div>`;
  html += top.map(p => `<div class="redzone-pick">
    <span style="color:${p.color};font-weight:600">${esc(p.player_display_name)} <span style="color:var(--text-dimmer);font-weight:400">(${p.team} ${slotLabel(p.slot)})</span></span>
    <span style="color:var(--text-dim)">${p.td_per_g} TD/g</span>
  </div>`).join('');

  document.getElementById('player-modal-body').innerHTML = html;
  document.getElementById('player-modal').classList.add('open');
}
function closePlayerProps(){
  document.getElementById('player-modal').classList.remove('open');
}
</script>
</body>
</html>
